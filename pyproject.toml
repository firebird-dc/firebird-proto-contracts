[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firebird-api-client"
version = "0.5.0"
description = "Generated Python client artifacts and handwritten helpers for the Firebird API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Firebird" }
]
dependencies = [
  "protobuf>=5,<6",
  "grpcio>=1.60,<2",
  "googleapis-common-protos>=1.63"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["gen/python", "sdk/python"]
