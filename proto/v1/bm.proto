  }

  // AttachBMToSubnet attaches a bare-metal server to a subnet.
  // project_id and bm_id are taken from the path; subnet_id is in the
  // JSON body. (Previously this was body: "subnet_id" — a bare-string
  // body — but body: "*" is consistent with every other Create-style
  // RPC and makes the request shape extensible. Migrating callers had
  // to switch from `"subnet.01..."` to `{"subnet_id": "subnet.01..."}`.)
  rpc AttachBMToSubnet(AttachBMToSubnetRequest) returns (OperationResponse) {
    option (google.api.http) = {
      post: "/projects/{project_id}/compute/bms/{bm_id}/attach-subnet"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Attach bare-metal server to subnet";
      description: "Attaches a bare-metal server to a subnet and creates an async task for the controller.";
      tags: "Bare Metal";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        };
      };
      responses: {
        key: "202";
        value: {
          description: "Accepted"
          schema: {
            json_schema: { ref: ".firebird.api.v1.OperationResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Bare-metal server or subnet not found" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (server already attached to a subnet)" };
      }
    };
  }

  // DetachBMFromSubnet detaches a bare-metal server from its subnet
  // project_id and bm_id are taken from the path; no request body.
  rpc DetachBMFromSubnet(DetachBMFromSubnetRequest) returns (OperationResponse) {
    option (google.api.http) = {
      post: "/projects/{project_id}/compute/bms/{bm_id}/detach-subnet"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Detach bare-metal server from subnet";
      description: "Detaches a bare-metal server from its subnet and creates an async task for the controller.";
      tags: "Bare Metal";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        };
      };
      responses: {
        key: "202";
        value: {
          description: "Accepted"
          schema: {
            json_schema: { ref: ".firebird.api.v1.OperationResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Bare-metal server not found" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (server not attached to any subnet)" };
      }
    };
  }

  // ListTenantBMs lists all bare-metal servers in the tenant (no project filter)
  rpc ListTenantBMs(ListTenantBMsRequest) returns (ListBMsResponse) {
