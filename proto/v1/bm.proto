}


 message DerivedPowerStateEnum{
   enum DerivedPowerState {
     UNSPECIFIED = 0;
     OFF = 1;            // Server is powered off (default)
     ON = 2;             // Server is powered on
     POWERING_ON = 3;    // Server is transitioning from off to on
     POWERING_OFF = 4;   // Server is transitioning from on to off
     REBOOTING = 5;      // Server is rebooting (power cycle in progress)
   }
 }

