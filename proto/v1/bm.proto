      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Bare-metal server not found" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (server in incompatible state for power off)" };
      }
    };
  }

  // RebootBM reboots a bare-metal server
  rpc RebootBM(PowerControlBMRequest) returns (OperationResponse) {
    option (google.api.http) = {
      post: "/projects/{project_id}/compute/bms/{bm_id}/reboot"
