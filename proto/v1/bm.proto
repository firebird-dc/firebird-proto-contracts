  string bm_id = 1;
  string namespace = 2;                    // Optional: Kubernetes namespace (defaults to "default")
  string credential_name = 3;               // Optional: Name of the Kubernetes Secret storing BMC credentials
  string image_id = 4;                     // Optional: Image ID for OS provisioning
  string user_data_b64 = 5; // Optional: Base64-encoded cloud-init/userData content (controller creates secret with name "{machine-name}-userdata")
  string user_data_secret_namespace = 11;  // Optional: namespace for userData secret (defaults to same namespace as BMH)
  string root_disk_wwn = 6;                // Optional: WWN of the root disk to install the OS on
  string network_data_secret = 7;         // Optional: Name of the Secret to store generated network data
}

