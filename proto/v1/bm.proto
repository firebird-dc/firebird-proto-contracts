      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Bare-metal server not found" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (server in incompatible state for power on)" };
      }
    };
  }

  // PowerOffBM powers off a bare-metal server
  rpc PowerOffBM(PowerControlBMRequest) returns (OperationResponse) {
    option (google.api.http) = {
      post: "/projects/{project_id}/compute/bms/{bm_id}/power-off"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Power off a bare-metal server";
      description: "Powers off a bare-metal server and creates an async task for the provisioning controller.";
      tags: "Bare Metal";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
