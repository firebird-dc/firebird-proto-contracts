syntax = "proto3";

package firebird.api.v1;

option go_package = "github.com/firebird-dc/firebird-proto-contracts/gen/go;v1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "common.proto";
import "operation.proto";


// BMService provides client-facing operations for managing bare-metal servers
// Internal fields (BMC credentials, MAC address) are hidden from clients
service BMService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Bare Metal"
    description: "Bare-metal server lifecycle operations.\n\nIncludes:\n- List and get bare-metal servers\n- Provision operations\n- Power on/off, reboot\n- Attach / detach bare-metal servers to subnets\n\nAll endpoints require a Bearer token (Authorization header)."
  };
  // GetBM retrieves a bare-metal server including lifecycle state, power state, spec, pending operations, and tags
  rpc GetBM(GetBMRequest) returns (BMResponse) {
    option (google.api.http) = {
      get: "/projects/{project_id}/compute/bms/{bm_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a bare-metal server by ID";
      description: "Retrieves a specific bare-metal server by its unique identifier. The response includes the full resource state (lifecycle, power), spec, pending operations, and tags.";
      tags: "Bare Metal";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        };
      };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.BMResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
      responses: {
        key: "404"; value: { description: "Bare-metal server not found" };
      }
    };
  }
  
  // ListBMs lists all bare-metal servers.
  rpc ListBMs(ListBMsRequest) returns (ListBMsResponse) {
    option (google.api.http) = {
      get: "/projects/{project_id}/compute/bms"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List bare-metal servers in a project";
      description: "List all bare-metal servers for the specified project";
      tags: "Bare Metal";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        };
      };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListBMsResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }
  
  // ProvisionBM provisions an existing bare-metal server
  rpc ProvisionBM(ProvisionBMRequest) returns (OperationResponse) {
    option (google.api.http) = {
      post: "/projects/{project_id}/compute/bms/{bm_id}/provision"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Provision a bare-metal server";
      description: "Provisions a bare-metal server and creates an async task for the provisioning controller.";
      tags: "Bare Metal";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        };
      };
      responses: {
        key: "202";
        value: {
          description: "Accepted"
          schema: {
            json_schema: { ref: ".firebird.api.v1.OperationResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Bare-metal server not found" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (server in incompatible state for provisioning)" };
      }
    };
  }

  // PowerOnBM powers on a bare-metal server
  rpc PowerOnBM(PowerControlBMRequest) returns (OperationResponse) {
