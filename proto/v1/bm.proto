          schema: {
            json_schema: { ref: ".firebird.api.v1.ListBMsResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  // AttachBMToProject attaches a bare-metal server to a project
  rpc AttachBMToProject(AttachBMToProjectRequest) returns (BMResponse) {
