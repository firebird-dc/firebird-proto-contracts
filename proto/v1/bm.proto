// LifecycleState represents the lifecycle state of a resource (BM or VPC)
message BM {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["id", "tenant_id", "name", "state", "power_state", "created_at", "updated_at"] }
  };
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Bare-metal server resource ID (format: bm.ULID)"}];
  string tenant_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string project_id = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string name = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable server name"}];
  string mac_address = 13 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "MAC address in format XX:XX:XX:XX:XX:XX"}];
  string subnet_id = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Subnet resource ID if attached (empty if not attached, format: subnet.ULID)"}];

  // Spec contains user-specified configuration (desired state)
  BMSpec spec = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User-specified desired configuration"}];

  // Status contains observed state from the system
  BMLifecycleStatus.LifecycleState state = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current lifecycle state"}];
  // Power state
  BMPowerStatus.PowerState power_state = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current power state (ON or OFF)"}];
  // Tags
  map<string, string> tags = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Key-value metadata tags"}];

  // Timestamps
  google.protobuf.Timestamp created_at = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Creation timestamp"}];
  google.protobuf.Timestamp updated_at = 12 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Last update timestamp"}];

  // Machine type (hardware profile)
  string machine_type_id = 14 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Machine type resource ID (format: machine-type.ULID)"}];

  // Network
  string ip_address = 15 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Primary IPv4 address assigned to the server (empty if not yet discovered)"}];

  // InfiniBand partition memberships. Populated only when the InfiniBand
  // feature is enabled on the deployment; always empty otherwise.
  repeated BMIBPartitionMembership ib_partitions = 16 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "InfiniBand partition memberships confirmed for this server (empty when the feature is disabled)"
  }];
}

// BMIBPartitionMembership is the BM-centric readback of one InfiniBand
// partition membership. fabric_state is what the fabric manager confirmed, and it is the
// whole of the membership state Firebird owns: host-side IPoIB configuration
// belongs to the tenant, which manages its own bare-metal hosts.
message BMIBPartitionMembership {
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Membership resource ID (format: ib-partition-member.ULID); matches the resource_id of attach/detach operations"}];
  string ib_partition_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "InfiniBand partition resource ID (format: ib-partition.ULID)"}];
  string ib_partition_name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "InfiniBand partition name"}];
  string pkey = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "InfiniBand partition key, formatted as 0xhhhh"}];
  reserved 5, 6;
  reserved "ip_address", "interface_name";
  string fabric_state = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Fabric-confirmed state: attaching, active, detaching or error"}];
  reserved 8;
  reserved "host_state";
  optional string status_reason = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Stable machine-readable reason when a state is not terminal-healthy"}];
}

// BMSpec contains user-specified configuration for a bare-metal server
message BMSpec {
  string image_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Image resource ID for OS provisioning (empty if not set, format: image.ULID)"}];
  string user_data_base64 = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Base64-encoded cloud-init/userData content (empty if not set)"}];
  BMRootDisk root_disk = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Root disk configuration"}];
}

// BMRootDisk contains root disk configuration
message BMRootDisk {
  string wwn = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "World Wide Name (WWN) of the root disk (empty if not set)"}];
}


message BMLifecycleStatus {
  enum LifecycleState {
    UNSPECIFIED = 0;
    PROVISIONING = 1;   // In progress (default when unset)
    AVAILABLE = 2;      // Hardware ready for OS provisioning.
    RUNNING = 3;        // Provisioned and powered on
    DEGRADED = 4;       // Error or failed state
    STOPPING = 5;      // Desired power off, still powering down
    STOPPED = 6;       // Provisioned and powered off
    TERMINATING = 7;       // Deletion in progress
    DEPROVISIONING = 8;    // OS removal in progress
    ALLOCATED = 9;         // Tenant ownership recorded; hardware registration has not started
  }
  LifecycleState lifecycle_state = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current lifecycle state derived from provider reconciliation"}];
  string message = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable status message"}];
  google.protobuf.Timestamp last_transition_at = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Timestamp of the last state transition"}];
}

// BMPowerStatus contains power state information (ON or OFF only)
message BMPowerStatus {
  enum PowerState {
    UNSPECIFIED = 0;
    ON = 1;  // Server is powered on
    OFF = 2; // Server is powered off
  }
  PowerState power_state = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current power state (ON or OFF)"}];
}

message GetBMRequest {
  string project_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string bm_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Bare-metal server resource ID (format: bm.ULID)"}];
}

message ListBMsRequest {
