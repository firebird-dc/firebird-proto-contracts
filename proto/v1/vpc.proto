message Subnet {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["id", "tenant_id", "project_id", "vpc_id", "name", "cidr", "gateway_ip", "state", "created_at", "updated_at"] }
  };
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Subnet resource ID (format: subnet.ULID)"}];
