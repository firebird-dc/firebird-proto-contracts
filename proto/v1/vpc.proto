  string vpc_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "VPC resource ID (format: vpc.ULID)"}];
  string name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Subnet name. Allowed characters: alphanumeric, hyphens, underscores. Max length: 150."
    max_length: 150
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  string cidr = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "IPv4 CIDR block (e.g. 10.0.0.0/24)"}];
  string gateway_ip = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
