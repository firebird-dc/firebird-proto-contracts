// FirewallRuleProtocol represents allowed protocol values for firewall rules
message FirewallRuleProtocolEnum {
  enum FirewallRuleProtocol {
    UNSPECIFIED = 0;
    ALL = 1;  // Match all protocols
    TCP = 2;  // Transmission Control Protocol
    UDP = 3;  // User Datagram Protocol
    ICMP = 4; // Internet Control Message Protocol
  }
}
// FirewallRuleAction represents action values for firewall rules
message FirewallRuleActionEnum{
  enum FirewallRuleAction {
    UNSPECIFIED = 0;
    ALLOW = 1; // Allow matching traffic
    DENY = 2;  // Deny matching traffic
  }
}

// FirewallRule represents a firewall rule
message FirewallRule {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["id", "tenant_id", "project_id", "vpc_id", "name", "state", "created_at", "updated_at"] }
  };
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Firewall rule resource ID (format: firewall-rule.ULID)"}];
  string tenant_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string project_id = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string vpc_id = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "VPC resource ID this rule applies to (format: vpc.ULID)"}];
  string name = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable rule name"}];
  FirewallRuleProtocolEnum.FirewallRuleProtocol protocol = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Protocol: ALL, TCP, UDP, or ICMP"}];
  reserved 7, 8, 9;
  bool stateful = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "When true, return traffic is automatically allowed"}];
  reserved 11;
  optional int32 src_port_from = 12 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Source port range start (1-65535)"}];
  optional int32 src_port_to = 13 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Source port range end (1-65535)"}];
  optional int32 dst_port_from = 14 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Destination port range start (1-65535)"}];
  optional int32 dst_port_to = 15 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Destination port range end (1-65535)"}];
  string src_prefix = 16 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Source IP prefix in CIDR notation (e.g. 10.0.0.0/24)"}];
  string dst_prefix = 17 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Destination IP prefix in CIDR notation (e.g. 0.0.0.0/0)"}];
  FirewallRuleActionEnum.FirewallRuleAction action = 18 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Action: ALLOW or DENY"}];
  reserved 19;
  VPCLifecycleState.State state = 20 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current lifecycle state (PROVISIONING, READY, ERROR, DELETING)"}];

  google.protobuf.Timestamp created_at = 22 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Creation timestamp"}];
  google.protobuf.Timestamp updated_at = 23 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Last update timestamp"}];
  optional int32 icmp_type = 24 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "ICMP type number (0-255). Only valid when protocol is ICMP. Omit for all ICMP types."}];
}

