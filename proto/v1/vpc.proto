  string name = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable subnet name"}];
  string cidr = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "IPv4 CIDR block (e.g. 10.0.0.0/24)"}];
  string gateway_ip = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Gateway IP address (first usable IP in CIDR range, e.g. 10.0.0.1)"}];
  VPCLifecycleState.State state = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current lifecycle state (PROVISIONING, READY, ERROR, DELETING)"}];

  google.protobuf.Timestamp created_at = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Creation timestamp"}];
  google.protobuf.Timestamp updated_at = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Last update timestamp"}];

  optional ResourceError error = 12 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Most recent provisioning failure. Present while state is ERROR; cleared when the subnet recovers."}];
}

message CreateSubnetRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["name", "cidr", "gateway_ip"] }
  };
