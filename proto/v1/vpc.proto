// VPCLifecycleState is a message wrapper containing the lifecycle state enum for VPC, Subnet, and FirewallRule.
// Nested in a message so enum value names (PROVISIONING, READY, ERROR, DELETING) do not conflict with FilesystemState in the same package.
message VPCLifecycleState {
  enum State {
    UNSPECIFIED = 0;
    PROVISIONING = 1; // Resource is being created or configured by the provider
    READY = 2;        // Resource is fully operational
    DELETING = 3;     // Resource deletion is in progress
    ERROR = 4;        // Create/update failed permanently; needs a fresh operation to recover
  }
}

// VPC represents a virtual private cloud
message VPC {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["id", "tenant_id", "project_id", "name", "state", "created_at", "updated_at"] }
  };
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "VPC resource ID (format: vpc.ULID)"}];
  string tenant_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string project_id = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string name = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable VPC name"}];
  string cidr = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "IPv4 CIDR block for this VPC"}];
  VPCLifecycleState.State state = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Current lifecycle state (PROVISIONING, READY, ERROR, DELETING)"}];

  google.protobuf.Timestamp created_at = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Creation timestamp"}];
  google.protobuf.Timestamp updated_at = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Last update timestamp"}];

  optional ResourceError error = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Most recent provisioning failure. Present while state is ERROR; cleared when the VPC recovers."}];
}

// tenant_id is extracted from the bearer token, not from the request
message CreateVPCRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["name"] }
  };
  string project_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "VPC name. Allowed characters: alphanumeric, hyphens, underscores. Max length: 150."
    max_length: 150
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  optional string cidr = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Optional IPv4 CIDR block within RFC 1918 private space (10.0.0.0/8, 172.16.0.0/16, or 192.168.0.0/16). "
                 "Prefix length MUST be one of /8, /16, or /24 — reverse-DNS zones (in-addr.arpa) require byte-aligned "
                 "prefixes so downstream DNS ops can own each zone cleanly. Examples: 10.0.0.0/8, 192.168.0.0/16, "
                 "192.168.1.0/24."
    example: "\"10.0.0.0/16\""
  }];
}

// GetVPCRequest represents a request to get a VPC
message GetVPCRequest {
  string project_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string vpc_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "VPC resource ID (format: vpc.ULID)"}];
}

