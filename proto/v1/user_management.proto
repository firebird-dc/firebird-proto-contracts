// ---------- INVITATIONS ----------

// RoleAssignment is one (project, role) grant. An empty project_id is a
// tenant-level (realm-wide) grant; a set project_id scopes the role to that
// single project. role is the role's immutable slug — same vocabulary as
// ProjectRoleAssignment.role and RoleView.role (a predefined role such as
// ADMIN/EDITOR/VIEWER, or one the tenant defines).
message RoleAssignment {
  string project_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Target project (format: project.ULID); empty = tenant-level (realm-wide) grant"}];
  string role       = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role to grant: the stable UPPERCASE slug (e.g. ADMIN, EDITOR, VIEWER, or a tenant-defined role)"}];
}

message InviteUserRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["email", "roleAssignments"] }
  };
  string email = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Email address to invite"}];
  // Field 2 ("role") reserved: the single caller-selected role was replaced by
  // the assignments list below.
  reserved 2;
  reserved "role";
  // (project, role) pairs granted when the invitee accepts. Each project_id must
  // be a project of the caller's tenant.
  repeated RoleAssignment role_assignments = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role assignments granted on accept"}];
}

message RemoveTenantMemberRequest {
  string user_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "ID of the user to remove from the caller's tenant (format: user.ULID)"}];
}

message RemoveTenantMemberResponse {}

message GetInvitationInfoRequest {
  // KC organization id carried in the invite link (?org=...). Maps to a tenant.
  string org_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Organization id from the invite link"}];
}
message GetInvitationInfoResponse {
  string tenant_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string tenant_name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant display name"}];
  string email = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Invited email address"}];
  // Field 4 ("role") reserved: replaced by the assignments list.
  reserved 4;
  reserved "role";
  string status = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Invitation status: \"PENDING\" or \"EXPIRED\""}];
  // (project, role) pairs granted on accept.
  repeated RoleAssignment role_assignments = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role assignments granted on accept"}];
  // needs_personal_details is true when the invitee has no user record yet (a
  // brand-new invitee). The console shows the personal-details step (CompleteSignup
  // with invited=true) — which creates the user record — before the accept page.
  // An invitee who already has a user record (from registration, a prior invite,
  // or backfill) skips the step. AcceptInvitation requires the record to exist.
  bool needs_personal_details = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Whether the invitee must supply personal details (no user record yet) before accepting"}];
}
message AcceptInvitationRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["org_id"] }
  };
  // KC organization id carried in the invite link (?org=...). Maps to a tenant.
  string org_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Organization id from the invite link"}];
}
message AcceptInvitationResponse {
  string user_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "The joined user's resource ID (format: user.ULID)"}];
  string tenant_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant the caller joined (format: tenant.ULID)"}];
  // Field 3 ("role") reserved: replaced by the assignments list.
  reserved 3;
  reserved "role";
  // (project, role) pairs granted to the caller.
  repeated RoleAssignment role_assignments = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role assignments granted"}];
}

message InvitedUser {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["id", "tenant_id", "email", "roleAssignments", "created_at"] }
  };
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Invitation resource ID (format: invited-user.ULID)"}];
  string tenant_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string email = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Invitee email address"}];
  // Field 4 ("role") reserved: replaced by the assignments list.
  reserved 4;
  reserved "role";
  repeated RoleAssignment role_assignments = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role assignments granted on accept"}];
  string invited_by = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Subject ID of the inviting admin (empty if unknown)"}];
  google.protobuf.Timestamp created_at = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Creation timestamp"}];
  string status = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Derived invitation status: \"PENDING\" or \"EXPIRED\""}]; // "PENDING" or "EXPIRED"
  google.protobuf.Timestamp expires_at = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Invitation link expiry (created_at + 7 days; reset on resend)"}];
}

