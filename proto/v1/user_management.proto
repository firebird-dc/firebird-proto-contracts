}

message ProjectMember {
  string        subject_id    = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User or service account resource ID"}];
  SubjectTypeEnum.SubjectType   subject_type  = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Whether subject is a USER or SERVICE_ACCOUNT"}];
  string        display_name  = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Display name"}];
  string        email         = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Email address (empty for service accounts)"}];
  repeated RoleEnum.Role project_roles = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project-level roles assigned to this member"}];
}

message ListProjectMembersResponse {
  repeated ProjectMember members = 1;
}

// ---------- ACCESS MANAGEMENT ----------

// SetUserAccessRequest fully replaces a user's access in one call. Both scopes
// may be set together (a subject may hold tenant roles AND project roles); an
// empty list clears that scope, and an empty request clears all access.
message SetUserAccessRequest {
  string user_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User resource ID (format: user.ULID); tenant is implicit from context"}];
  repeated string tenant_roles = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Desired tenant-scope role names (ADMIN | EDITOR | VIEWER). Empty clears tenant-scope access."}];
  repeated ProjectRoleAssignment project_roles = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Desired project-scope role assignments; multiple roles per project allowed. Empty clears project-scope access."}];
}

message ProjectRoleAssignment {
  string project_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID)"}];
  string role       = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role name: the stable UPPERCASE slug (ADMIN | EDITOR | VIEWER)"}];
}

message SetServiceAccountAccessRequest {
  string service_account_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Service account resource ID (format: sa.ULID); tenant is implicit from context"}];
  repeated string tenant_roles = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Desired tenant-scope role names (ADMIN | EDITOR | VIEWER). Empty clears tenant-scope access."}];
  repeated ProjectRoleAssignment project_roles = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Desired project-scope role assignments; multiple roles per project allowed. Empty clears project-scope access."}];
}

// ---------- ENUMS ----------

// Role is used for both tenant-level and project-level roles.
// Tenant: ADMIN, EDITOR, VIEWER. Project: ADMIN, EDITOR, VIEWER.
message RoleEnum{
  enum Role {
    UNSPECIFIED = 0;
    ADMIN = 1;
    EDITOR = 2;
    VIEWER = 3;
  }
}