// ---------- TOKEN ----------

message TokenRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: { required: ["grant_type"] }
  };
  // "client_credentials" for service accounts, "password" for users, "refresh_token" to rotate tokens.
  string grant_type = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "OAuth2 grant type. Valid values: password, client_credentials, refresh_token"
  }];
  string client_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Service account client ID (required for client_credentials grant)"
  }];
  string client_secret = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Service account client secret (required for client_credentials grant)"
  }];
  string email = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "User email address (required for password grant)"
  }];
  string password = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "User password (required for password grant)"
  }];
  string refresh_token = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Refresh token from a previous Token call (required for refresh_token grant)"
  }];
}

message TokenResponse {
  string access_token = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "JWT access token"}];
  string token_type = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Token type (always \"Bearer\")"}];
  // int32, not int64, because proto3 JSON serializes int64 as a quoted
  // string (precision-preservation for JS) — which violates OAuth2
  // RFC 6749 §5.1 ("expires_in" must be a JSON number) and breaks any
  // typed client decoder that expects a number. Token TTLs (~3600s
  // typical, max realistic ~1 year) fit comfortably in int32.
  int32  expires_in = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Token lifetime in seconds", type: INTEGER, format: "int32"}];
  string refresh_token = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Refresh token for obtaining new access tokens"}];
  string id_token = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "OIDC ID token"}];
}

// ---------- SELF ----------

message GetUserInfoRequest {}

message GetUserInfoResponse {
  string                 user_id      = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Caller resource ID: user.ULID, or service_account.ULID for a service account."}];
  string                 email        = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User email address"}];
  string                 display_name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User display name"}];
  string                 tenant_id    = 4 [deprecated = true, (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Deprecated: use tenants instead. Populated with the first entry of tenants (a user's oldest membership, or a service account's owning tenant) for backward compatibility."}];
  repeated RoleEnum.Role tenant_roles = 5 [deprecated = true, (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Deprecated: use roles instead. Tenant-level roles assigned to this user."}];
  reserved 6; // was: TenantInfo tenant (single active tenant) — replaced by tenants
  repeated TenantInfo    tenants      = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenants the caller belongs to: a user's memberships (via invitations or home tenant), or a service account's single owning tenant. Includes the tenant reported in tenant_id."}];
  repeated RoleView      roles        = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Display: the caller's role bindings verbatim, across every tenant they belong to. project_id \"\" = tenant scope."}];
  repeated AccessEntry   access       = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Gating: effective, fully-expanded permission keys grouped by (tenant_id, project_id). project_id \"\" = tenant scope (covers all projects)."}];
}

message RoleView {
  string tenant_id  = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string project_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID); empty = tenant scope"}];
  string role         = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Role name: the stable UPPERCASE slug (e.g. ADMIN)"}];
  string display_name = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable role label (e.g. Admin)"}];
}

// RoleDefinition is one role available to a tenant, for role-picker UIs. The
// name is the value accepted by InviteUser assignments and the access endpoints.
message RoleDefinition {
  string name         = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Stable UPPERCASE role name/slug (e.g. ADMIN); the value accepted in role assignments"}];
  string display_name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Human-readable role label (e.g. Admin)"}];
  bool   predefined   = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "True for a built-in global role; false for a tenant-defined role"}];
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleDefinition roles = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Roles the tenant can assign, predefined first then tenant-defined, each alphabetical by name"}];
}

message AccessEntry {
  string tenant_id           = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string project_id          = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Project resource ID (format: project.ULID); empty = tenant scope (covers all projects)"}];
  repeated string permissions = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Effective, fully-expanded permission keys (area.resource:action); no wildcards"}];
}

message TenantInfo {
  string id                = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant resource ID (format: tenant.ULID)"}];
  string name              = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant name"}];
  string tenant_type       = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant type: \"personal\" or \"organization\""}]; // "personal" or "organization"
  string compliance_status = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Compliance status: \"UNVERIFIED\" or \"VERIFIED\""}]; // "UNVERIFIED" or "VERIFIED"
  reserved 5;
  bool   suspended         = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "True when the tenant is soft-suspended for an outstanding balance. While true the API blocks creating new resources and starting stopped VMs; it clears automatically on the next successful payment. The console reads this to show the suspended state and gate create/start actions."}];
  string company_name             = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Company name (organization tenants only; empty for personal tenants)"}];
  string tax_id                   = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tax ID / VAT number (organization tenants only; empty when unset)"}];
  string country                  = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tenant's registration country as an ISO alpha-3 code — the individual's residency country for personal tenants, the country of incorporation for organization tenants."}];
  bool   billing_active           = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "True when the tenant has a live way to pay: an active bound card OR an active promotional credit grant (activated, not expired, credit left). False means neither — the console should send the tenant to add a card before creating billable resources."}];
