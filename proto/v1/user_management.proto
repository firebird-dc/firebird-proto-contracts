syntax = "proto3";

package firebird.api.v1;

option go_package = "github.com/firebird-dc/firebird-proto-contracts/gen/go;v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

service UserManagementService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "IAM"
    description: "Identity and Access Management API.\n\nKey rules:\n- Tenant is implicit from JWT.\n- Creating a user or service account grants NO roles by default.\n- Roles are granted only via explicit role-binding endpoints.\n- Tenant ADMIN can manage all users, service accounts, and role bindings in a tenant.\n- Project ADMIN can manage project-level role bindings within that project."
  };

  // ---------- TOKEN ----------
  // Intentionally public (security: {}) — no BearerAuth. Clients call this to obtain a token.

  rpc Token(TokenRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/auth/token"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get authentication token"
      description: "Obtain an access token using one of the supported grant types:\n\n**password** — for users. Provide `email` and `password`.\n\n**client_credentials** — for service accounts. Provide `client_id` and `client_secret`.\n\n**refresh_token** — rotate an expiring access token. Provide the `refresh_token` returned by a previous Token call. \n\nReturns a JWT access token that must be included in all subsequent requests as `Authorization: Bearer <token>`."
      operation_id: "GetToken"
      tags: "IAM"
      security: {};
      responses: {
        key: "200";
        value: {
          description: "Successful authentication"
          schema: {
            json_schema: { ref: ".firebird.api.v1.TokenResponse" }
          }
        };
      },
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      },
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
    };
  }

  // ---------- USERS ----------
  // NOTE: CRUD RPCs (GetUser, ListUsers, etc.) MUST be defined before the /users/me
  // RPCs (GetUserInfo, ChangePassword). grpc-gateway's ServeMux.Handle() prepends
  // handlers, so later-registered patterns are checked first. By defining GetUser
  // (/users/{user_id}) before GetUserInfo (/users/me), the literal "/users/me" pattern
  // ends up ahead of the wildcard in the match list, preventing the wildcard from
  // swallowing the literal path.

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a user"
      description: "Creates a user. Requires tenant ADMIN.\n\nNo roles are granted at creation — grant roles explicitly after creation.\n\nA cryptographically random temporary password is generated and returned once in `initial_password`. The user must change it via `POST /users/me/password`."
      operation_id: "CreateUser"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "201";
        value: {
          description: "Created"
          schema: {
            json_schema: { ref: ".firebird.api.v1.CreateUserResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (resource already exists or incompatible state)" };
      }
    };
  }

  rpc GetUser(GetUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/users/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get user by ID"
      description: "Returns a single user by ID. Requires tenant VIEWER or higher."
      operation_id: "GetUser"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.UserResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
      responses: {
        key: "404"; value: { description: "User not found" };
      }
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/users"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List users"
      description: "Returns users in the caller's tenant. Requires tenant VIEWER or higher. Supports `limit` (default 20, max 100) and `offset` for pagination."
      operation_id: "ListUsers"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListUsersResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/users/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete a user"
      description: "Permanently removes the user from the system. All tenant and project role bindings are cascade-deleted. Requires tenant ADMIN."
      operation_id: "DeleteUser"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "202";
        value: {
          description: "Accepted"
          schema: {
            json_schema: { ref: ".firebird.api.v1.DeleteUserResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "User not found" };
      }
    };
  }

  // ---------- INVITATIONS ----------

  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse) {
    option (google.api.http) = {
      post: "/users/invitations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Invite a user to the tenant"
      description: "Creates a pending invitation for an email to join the tenant. The invitee is always granted tenant ADMIN on accept — the role is not caller-selectable (the request's `role` field is reserved and ignored). Tenant membership and the ADMIN role are granted when the invitee accepts. Requires tenant ADMIN.\n\nFor organization tenants the invitee's email domain MUST be one of the tenant's VERIFIED domains, otherwise the request is rejected with 403.\n\nIdempotency: a second invitation for an email that already has a pending invitation in this tenant returns 409."
      operation_id: "InviteUser"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "201";
        value: {
          description: "Created"
          schema: {
            json_schema: { ref: ".firebird.api.v1.InviteUserResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions, unverified tenant, or email domain not verified for this organization" };
      }
      responses: {
        key: "409"; value: { description: "A pending invitation for this email already exists" };
      }
    };
  }

  // ListInvitations is defined after GetUser (/users/{user_id}) so grpc-gateway's
  // prepend ordering gives the literal GET /users/invitations higher match
  // priority than the GET /users/{user_id} wildcard.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {
      get: "/users/invitations"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List pending invitations"
      description: "Returns the tenant's pending invitations (newest first), each with a derived status (PENDING or EXPIRED) and expiry. Accepted and revoked invitations are deleted and do not appear. Requires tenant VIEWER or higher."
      operation_id: "ListInvitations"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListInvitationsResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse) {
    option (google.api.http) = {
      post: "/users/invitations/{invitation_id}/resend"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Resend an invitation"
      description: "Resets the invitation's expiry to a fresh 7-day window. Requires tenant ADMIN."
      operation_id: "ResendInvitation"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ResendInvitationResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Invitation not found" };
      }
    };
  }

  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (google.api.http) = {
      delete: "/users/invitations/{invitation_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Revoke an invitation"
      description: "Revokes a pending invitation by deleting the invitation record. Requires tenant ADMIN."
      operation_id: "RevokeInvitation"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "202";
        value: {
          description: "Accepted"
          schema: {
            json_schema: { ref: ".firebird.api.v1.RevokeInvitationResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "404"; value: { description: "Invitation not found" };
      }
    };
  }

  rpc ListTenantMembers(ListTenantMembersRequest) returns (ListTenantMembersResponse) {
    option (google.api.http) = {
      get: "/tenant/members"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List tenant members"
      description: "Returns the users who are members of the caller's tenant (via tenant membership), each with their tenant-level roles. Requires tenant VIEWER or higher."
      operation_id: "ListTenantMembers"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListTenantMembersResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  rpc ListTenantDomains(ListTenantDomainsRequest) returns (ListTenantDomainsResponse) {
    option (google.api.http) = {
      get: "/tenant/domains"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List the tenant's domains"
      description: "Returns the caller tenant's email domains with their verification status. A VERIFIED domain lets the tenant invite users whose email is on that domain; the invite dialog shows the verified ones. Requires tenant VIEWER or higher."
      operation_id: "ListTenantDomains"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListTenantDomainsResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  // ListRoles returns the roles available in the caller's tenant: the
  // predefined (global) roles plus any the tenant has defined. Clients use it
  // to populate role pickers when inviting a user or assigning access.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/roles"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List roles available to the tenant"
      description: "Returns the roles the caller's tenant can assign: the predefined roles (ADMIN, EDITOR, VIEWER) plus any tenant-defined roles. Each entry carries the role's stable UPPERCASE name/slug, its human-readable display name, and whether it is predefined. Names returned here are the values accepted in InviteUser role assignments; the access endpoints currently accept only the predefined roles. Requires tenant VIEWER or higher."
      operation_id: "ListRoles"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListRolesResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  rpc RemoveTenantMember(RemoveTenantMemberRequest) returns (RemoveTenantMemberResponse) {
    option (google.api.http) = {
      delete: "/tenant/members/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove a member from the tenant"
      description: "Removes a user's membership and all tenant- and project-level role bindings within the caller's tenant, and removes them from the tenant's identity-provider organization (best-effort mirror). The user account itself is NOT deleted (use DeleteUser for that), and any other tenants the user belongs to are unaffected. Requires tenant ADMIN.\n\nA caller cannot remove themselves."
      operation_id: "RemoveTenantMember"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.RemoveTenantMemberResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing user_id, or removing yourself)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
      responses: {
        key: "404"; value: { description: "User is not a member of the tenant" };
      }
    };
  }

  rpc GetInvitationInfo(GetInvitationInfoRequest) returns (GetInvitationInfoResponse) {
    option (google.api.http) = {
      get: "/invitations/info"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get invitation context (invitee)"
      description: "Returns the pending invitation addressed to the authenticated caller for the organization in the invite link, so the accept page can show the tenant and role. The invitation must be addressed to the caller's own email. Requires a valid token; the caller need not belong to any tenant yet."
      operation_id: "GetInvitationInfo"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: { description: "OK"; schema: { json_schema: { ref: ".firebird.api.v1.GetInvitationInfoResponse" } } };
      }
      responses: { key: "401"; value: { description: "Missing or invalid authentication token" }; }
      responses: { key: "404"; value: { description: "No matching invitation" }; }
    };
  }

  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {
      post: "/invitations/accept"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Accept an invitation (invitee)"
      description: "Joins the authenticated caller to the inviting tenant: writes tenant membership and the invitation's role, then consumes the invitation. The invitation must be addressed to the caller's own email and not expired. Requires a valid token; the caller need not belong to any tenant yet."
      operation_id: "AcceptInvitation"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: { description: "OK"; schema: { json_schema: { ref: ".firebird.api.v1.AcceptInvitationResponse" } } };
      }
      responses: { key: "400"; value: { description: "Invalid request or expired invitation" }; }
      responses: { key: "401"; value: { description: "Missing or invalid authentication token" }; }
      responses: { key: "404"; value: { description: "No matching invitation" }; }
    };
  }

  // ---------- SELF ----------
  // Defined after /users/{user_id} so grpc-gateway's prepend ordering gives
  // the literal /users/me pattern higher match priority than the wildcard.

  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {
    option (google.api.http) = {
      get: "/users/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get current user info"
      description: "Returns the authenticated caller's identity (user ID, email, display name), their tenant-level role bindings."
      operation_id: "GetUserInfo"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.GetUserInfoResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
    };
  }

  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse) {
    option (google.api.http) = {
      get: "/users/me/profile"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get current user profile"
      description: "Returns the authenticated caller's profile: user ID, full name, email address, and phone number. The caller need not belong to any tenant yet. Service accounts have no user profile and receive 404."
      operation_id: "GetUserProfile"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.GetUserProfileResponse" }
          }
        };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "404"; value: { description: "No user profile for this subject (e.g. service account)" };
      }
    };
  }

  // ---------- SERVICE ACCOUNTS ----------

  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse) {
    option (google.api.http) = {
      post: "/service-accounts"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a service account"
      description: "Creates a service account in the caller's tenant. Requires tenant ADMIN.\n\nNo roles are granted at creation — grant roles explicitly after creation."
      operation_id: "CreateServiceAccount"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "201";
        value: {
          description: "Created"
          schema: {
            json_schema: { ref: ".firebird.api.v1.CreateServiceAccountResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions or unverified tenant" };
      }
      responses: {
        key: "409"; value: { description: "Conflict (resource already exists or incompatible state)" };
      }
    };
  }

  rpc GetServiceAccount(GetServiceAccountRequest) returns (ServiceAccountResponse) {
    option (google.api.http) = {
      get: "/service-accounts/{account_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get service account by ID"
      description: "Returns a single service account by ID. Requires tenant VIEWER or higher."
      operation_id: "GetServiceAccount"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ServiceAccountResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
      responses: {
        key: "404"; value: { description: "Service account not found" };
      }
    };
  }

  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (google.api.http) = {
      get: "/service-accounts"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List service accounts"
      description: "Returns service accounts in the caller's tenant. Requires tenant VIEWER or higher. Supports `limit` (default 20, max 100) and `offset` for pagination."
      operation_id: "ListServiceAccounts"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "200";
        value: {
          description: "OK"
          schema: {
            json_schema: { ref: ".firebird.api.v1.ListServiceAccountsResponse" }
          }
        };
      }
      responses: {
        key: "400"; value: { description: "Invalid request (missing or malformed fields)" };
      }
      responses: {
        key: "401"; value: { description: "Missing or invalid authentication token" };
      }
      responses: {
        key: "403"; value: { description: "Insufficient permissions" };
      }
    };
  }

  rpc DeleteServiceAccount(DeleteServiceAccountRequest) returns (DeleteServiceAccountResponse) {
    option (google.api.http) = {
      delete: "/service-accounts/{account_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete a service account"
      description: "Permanently removes the service account from the system. Requires tenant ADMIN."
      operation_id: "DeleteServiceAccount"
      tags: "IAM"
      security: { security_requirement: { key: "BearerAuth"; value: {}; }; };
      responses: {
        key: "202";
        value: {
